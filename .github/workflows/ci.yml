name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Syntax, ShellCheck, and unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run syntax checks
        run: bash -n install-arch/install-arch.sh install-arch/test/*.sh

      - name: Run ShellCheck
        run: shellcheck install-arch/install-arch.sh install-arch/test/*.sh

      - name: Run unit tests
        run: ./install-arch/test/unit_tests.sh

  integration-test:
    name: Arch Linux loop-device integration test
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Update Arch Linux and install dependencies
        run: pacman -Syu --noconfirm util-linux

      - name: Run integration test
        run: ./install-arch/test/integration_test.sh
